[package]
name = "omniscope-search"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Persistent fuzzy search worker for the OmniScope Omarchy plugin"

[dependencies]
ignore = "0.4.23"
nucleo-matcher = "0.3.1"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
strip = true

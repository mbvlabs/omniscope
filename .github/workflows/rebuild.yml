name: Rebuild and upload shippable binary

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          channel: "1.98.1"

      - name: Build and normalize
        run: |
          source scripts/normalize-elf.sh
          build_dir=$(mktemp -d)/target
          cd "$GITHUB_WORKSPACE"
          cargo build --release --locked --target-dir "$build_dir"
          normalize_elf "$build_dir/release/omniscope-search" "$GITHUB_WORKSPACE/bin/omniscope-search"
          cd bin && sha256sum omniscope-search > omniscope-search.sha256
          cat omniscope-search.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omniscope-search-rebuild
          path: |
            bin/omniscope-search
            bin/omniscope-search.sha256
